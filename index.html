<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="起点导航：收录开发、AI、设计、学习与效率工具，让常用网站一触即达。" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>起点导航 · 精选网站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M18 32h27M34 20l12 12-12 12' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('nav-theme');
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
    <script src="./sites.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主要内容</a>

    <header class="site-header">
      <a class="brand" href="./" aria-label="起点导航首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
        </span>
        <span>起点导航</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" /></svg>
      </button>
    </header>

    <main id="main" class="container">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow"><span id="site-total">30</span> 个精选网站 <span aria-hidden="true">·</span> 6 个实用分类</p>
        <h1 id="page-title">少一点寻找，<br />多一点抵达。</h1>
        <p class="hero-description">常用工具与优质内容，安静有序地放在这里。</p>
      </section>

      <section class="controls" aria-label="网站搜索与筛选">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
          <label class="sr-only" for="search-input">搜索网站</label>
          <input id="search-input" type="search" placeholder="搜索名称、简介或标签…" autocomplete="off" spellcheck="false" />
          <kbd class="search-shortcut" aria-hidden="true">/</kbd>
        </div>
        <nav class="category-list" id="category-list" aria-label="网站分类"></nav>
      </section>

      <div class="results-meta">
        <p id="results-count" role="status" aria-live="polite">共 30 个网站</p>
        <button id="clear-button" class="text-button" type="button" hidden>清除筛选</button>
      </div>

      <section id="site-grid" class="site-grid" aria-label="网站列表"></section>

      <section id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        </div>
        <h2>没有找到匹配的网站</h2>
        <p>试试其他关键词，或查看全部网站。</p>
        <button id="empty-reset" class="primary-button" type="button">查看全部网站</button>
      </section>
    </main>

    <footer class="site-footer">
      <p>为效率而选，为常用而留。</p>
      <p>© <span id="current-year"></span> 起点导航</p>
    </footer>

    <template id="site-card-template">
      <article class="site-card">
        <a class="card-link" target="_blank" rel="noopener noreferrer">
          <span class="site-avatar" aria-hidden="true"></span>
          <span class="site-content">
            <span class="site-name-row">
              <span class="site-name"></span>
              <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10" /></svg>
            </span>
            <span class="site-description"></span>
            <span class="site-domain"></span>
          </span>
        </a>
      </article>
    </template>
  </body>
</html>
