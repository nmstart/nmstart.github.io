<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="起点导航：收录开发、AI、设计、学习与效率工具，让常用网站一触即达。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="起点导航" />
    <meta property="og:title" content="起点导航 · 个人常用网站集合" />
    <meta property="og:description" content="收录个人常用的开发、AI、设计与效率工具，让常用网站一触即达。" />
    <meta property="og:url" content="https://nmstart.github.io/" />
    <meta property="og:image" content="https://nmstart.github.io/assets/icons/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>起点导航 · 个人常用网站集合</title>
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('nav-theme');
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
    <script src="./sites.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主要内容</a>

    <header class="site-header">
      <a class="brand" href="./" aria-label="起点导航首页">
        <img class="brand-mark" src="./assets/icons/favicon.png" alt="" width="36" height="36" />
        <span class="brand-name">起点<span class="brand-name-sub">导航</span></span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" /></svg>
      </button>
    </header>

    <main id="main" class="container">
      <section class="controls" aria-label="网站搜索与筛选">
        <div class="search-row">
          <a class="controls-brand" href="./" aria-label="起点导航首页">
            <img src="./assets/icons/favicon.png" alt="" width="28" height="28" />
          </a>
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
            <label class="sr-only" for="search-input">搜索网站</label>
            <input id="search-input" type="search" placeholder="搜索名称、简介或标签…" autocomplete="off" spellcheck="false" />
            <button class="search-clear" id="search-clear" type="button" aria-label="清除搜索内容" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
            <kbd class="search-shortcut" id="search-shortcut" aria-hidden="true">/</kbd>
          </div>
        </div>
        <nav class="category-list" id="category-list" aria-label="网站分类"></nav>
      </section>

      <noscript>
        <style>
          .controls,
          .results-meta,
          .site-grid {
            display: none !important;
          }
        </style>
        <section class="empty-state">
          <h2>需要启用 JavaScript</h2>
          <p>站点列表由浏览器脚本渲染。启用 JavaScript 并刷新后，即可浏览全部网站。</p>
        </section>
      </noscript>

      <div class="results-meta">
        <p id="results-count" role="status" aria-live="polite">共 14 个网站</p>
        <button id="clear-recent" class="text-button" type="button" hidden>清除记录</button>
        <button id="clear-button" class="text-button" type="button" hidden>清除筛选</button>
        <button id="reset-order" class="text-button" type="button" hidden>恢复默认排序</button>
      </div>

      <section id="site-grid" class="site-grid" aria-label="网站列表"></section>

      <section id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
        </div>
        <h2>没有找到匹配的网站</h2>
        <p>试试其他关键词，或查看全部网站。</p>
        <button id="empty-reset" class="primary-button" type="button">查看全部网站</button>
      </section>
    </main>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7" /></svg>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <footer class="site-footer">
      <p>为效率而选，为常用而留。</p>
      <p>© <span id="current-year"></span> 起点导航</p>
    </footer>

    <template id="site-card-template">
      <article class="site-card">
        <a class="card-link" target="_blank" rel="noopener noreferrer">
          <span class="site-avatar" aria-hidden="true">
            <span class="recent-dot" aria-hidden="true"></span>
            <img class="site-favicon" alt="" width="22" height="22" loading="lazy" decoding="async" referrerpolicy="no-referrer" />
            <span class="site-fallback" aria-hidden="true"></span>
          </span>
          <span class="site-content">
            <span class="site-name-row">
              <span class="site-name"></span>
            </span>
            <span class="site-description"></span>
          </span>
        </a>
        <button class="copy-button" type="button" aria-label="复制网址" title="复制网址">
          <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="3" /><path d="M15 5H7a2 2 0 0 0-2 2v8" /></svg>
          <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" /></svg>
        </button>
      </article>
    </template>
  </body>
</html>
