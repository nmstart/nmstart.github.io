name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 拉全量历史,供空白字符检查对比 PR base / push 前一提交
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JS 语法检查
        run: |
          node --check theme.js
          node --check app.js
          node --check sites.js
          node --check sw.js

      # 与本地 pre-commit 钩子(./scripts/validate.mjs)共用同一份校验逻辑
      - name: 数据卫生与静态资源引用完整性
        run: node scripts/validate.mjs

      - name: index.html 引用完整性
        run: |
          for f in theme.js styles.css sites.js app.js; do
            grep -qF "./$f" index.html || { echo "index.html 缺少 ./$f 引用"; exit 1; }
          done

      # push 事件对比前一提交,PR 事件对比目标分支;新分支首个提交无前序点则跳过
      - name: 空白字符检查
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" HEAD
          else
            echo "无前序提交可对比,跳过"
          fi
